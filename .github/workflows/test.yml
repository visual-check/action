# The sharded check as a reusable workflow: `uses: visual-check/action/.github/workflows/test.yml@v1`. A plan job turns
# `shards` into the matrix, the consistency check runs in a job of its own, and one job per shard waits for it. Jobs run
# on separate machines, so each one runs `setup` to build and serve its own Storybook.
name: visual-check

on:
  workflow_call:
    inputs:
      shards:
        description: The number of shard jobs, from 1 to 256.
        type: number
        required: true
      setup:
        description: >-
          A bash script that installs, builds and serves Storybook and leaves it running. Every job runs it in
          working-directory, after checkout and Node setup, and stops at its first failing command.
        type: string
        required: true
      node-version-file:
        description: The file actions/setup-node reads the Node version from, relative to the repository root.
        type: string
        default: .nvmrc
      runs-on:
        description: The runner every job runs on.
        type: string
        default: ubuntu-24.04
      working-directory:
        description: Where setup and the CLI run, and where the config search starts.
        type: string
        default: .
      storybook:
        description: Runs one named Storybook (--storybook). Every Storybook by default.
        type: string
        default: ""
    secrets:
      NODE_AUTH_TOKEN:
        description: >-
          A registry token for setup, in its NODE_AUTH_TOKEN variable, which an .npmrc can read. secrets: inherit passes
          the caller's secret of that name.
        required: false

# All the jobs need. A called workflow can only narrow the token the caller grants, so the caller has to grant this.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: shards
        name: Turn the shard count into the matrix
        env:
          SHARDS: ${{ inputs.shards }}
        # GitHub makes at most 256 jobs from one matrix.
        run: |
          if ! [[ "$SHARDS" =~ ^[1-9][0-9]{0,2}$ ]] || (( SHARDS > 256 )); then
            echo "The shards input takes a whole number from 1 to 256. Got '$SHARDS'." >&2
            exit 1
          fi
          echo "shards=[$(seq "$SHARDS" | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  consistency:
    name: Consistency check
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - name: Set up the project
        working-directory: ${{ inputs.working-directory }}
        env:
          VISUAL_CHECK_SETUP: ${{ inputs.setup }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: eval "$VISUAL_CHECK_SETUP"
      # `$/` is this repository at the commit this workflow came from, so the ref a caller pins covers the Action too.
      - name: visual-check
        uses: $/
        with:
          consistency: true
          storybook: ${{ inputs.storybook }}
          working-directory: ${{ inputs.working-directory }}

  shard:
    name: Shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    needs: [plan, consistency]
    runs-on: ${{ inputs.runs-on }}
    strategy:
      # One failing shard leaves the others running.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - name: Set up the project
        working-directory: ${{ inputs.working-directory }}
        env:
          VISUAL_CHECK_SETUP: ${{ inputs.setup }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: eval "$VISUAL_CHECK_SETUP"
      - name: visual-check
        uses: $/
        with:
          shard: ${{ matrix.shard }}/${{ strategy.job-total }}
          storybook: ${{ inputs.storybook }}
          working-directory: ${{ inputs.working-directory }}
